name: Swift and iOS validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: counter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select upload-baseline toolchain
        id: xcode
        run: python3 scripts/select_xcode.py
      - name: Release pack checks
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/build_site.py --check
          python3 scripts/release_preflight.py
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Core tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee core-tests.log
      - name: Generate and validate project
        run: |
          python3 scripts/generate_project.py
          python3 scripts/check_project.py
          plutil -lint FoldCounter.xcodeproj/project.pbxproj
      - name: Build app and widget
        run: |
          set -o pipefail
          xcodebuild -project FoldCounter.xcodeproj -scheme FoldCounter \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios-build.log
      - name: UI smoke tests
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone") and v.get("isAvailable",False)))')
          xcodebuild -project FoldCounter.xcodeproj -scheme FoldCounter \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath DerivedData -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ui-tests.log
      - name: Export actual UI screenshot attachments
        run: xcrun xcresulttool export attachments --path UITestResults.xcresult --output-path screenshot-evidence
      - name: Select and probe Duo toolchain (including betas)
        id: duo
        run: python3 scripts/select_xcode.py --duo --optional
      - name: Compile Duo SDK path for simulator and device
        if: steps.duo.outputs.duo_available == 'true'
        run: |
          set -o pipefail
          xcodebuild -project FoldCounter.xcodeproj -scheme 'FoldCounter Duo' \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedDataDuo CODE_SIGNING_ALLOWED=NO build 2>&1 | tee duo-build.log
          xcodebuild -project FoldCounter.xcodeproj -scheme 'FoldCounter Duo' \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedDataDuoDevice CODE_SIGNING_ALLOWED=NO build 2>&1 | tee duo-device-build.log
      - name: Report unavailable Duo SDK
        if: steps.duo.outputs.duo_available != 'true'
        run: |
          echo "Duo API build SKIPPED: no installed SDK passed the hinge/arrangement declaration probe. Regular UI success is NOT Duo or publication readiness." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            *-tests.log
            *-build.log
            UITestResults.xcresult
            screenshot-evidence/
          if-no-files-found: warn
          retention-days: 7
