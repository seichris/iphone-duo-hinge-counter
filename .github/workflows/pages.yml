name: Publish support site (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_site.py --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy public support and privacy site
        id: deployment
        uses: actions/deploy-pages@v4
